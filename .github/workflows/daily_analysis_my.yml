name: My 自选股分析

on:
  schedule:
    - cron: '30 8 * * 1-5'     # 周一到周五，UTC 8:30 = 北京时间 16:30

  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'stocks-only'
        type: choice
        options:
          - full
          - market-only
          - stocks-only
      force_run:
        description: '强制运行'
        required: false
        default: false
        type: boolean

concurrency:
  group: stock-analysis-my
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.ANALYSIS_TIMEOUT_MINUTES || '30') }}

    steps:
      - name: 随机延迟
        run: sleep $((RANDOM % 60))

      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建必要目录
        run: |
          mkdir -p data logs reports

      - name: 执行股票分析
        env:
          # SenseNova Token Plan（OpenAI Compatible）
          # GitHub Secrets/Variables 使用清晰的 SENSENOVA_* 命名，映射到代码识别的 OPENAI_* 环境变量
          OPENAI_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.SENSENOVA_BASE_URL || 'https://token.sensenova.cn/v1' }}
          OPENAI_MODEL: ${{ secrets.SENSENOVA_MODEL || 'openai/sensenova-6.7-flash-lite' }}
          # 如需切回 Gemini 或其他 provider，直接改上面的映射或恢复下方配置
          # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STOCK_LIST: ${{ secrets.STOCK_LIST_MY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          LOG_LEVEL: INFO
          MAX_WORKERS: 1
          REPORT_TYPE: simple
          # Token Plan 优化：按请求次数计费，减少不必要的重试和间隔
          REPORT_INTEGRITY_RETRY: 0    # Phase 1：关闭完整性重试，避免每只股额外 1 次请求
          GEMINI_REQUEST_DELAY: 0      # Phase 1：取消请求间隔
          LLM_BATCH_MODE: true         # Phase 2：启用真·批量分析（12只股=2次请求）
          LLM_BATCH_SIZE: 6            # Phase 2：每批分析股票数
          LLM_BATCH_FALLBACK: true     # Phase 2：批量失败时自动降级为单只分析

        run: |
          MODE="${{ github.event.inputs.mode || 'stocks-only' }}"
          echo "🚀 My 自选股分析 - $MODE"
          echo "📊 自选股: $STOCK_LIST"

          FORCE_RUN_ARG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_RUN_ARG="--force-run"
          fi

          if [ "$MODE" = "market-only" ]; then
            python main.py --market-review $FORCE_RUN_ARG
          elif [ "$MODE" = "stocks-only" ]; then
            python main.py --no-market-review $FORCE_RUN_ARG
          else
            python main.py $FORCE_RUN_ARG
          fi

      - name: 上传分析报告
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: analysis-reports-my-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 30